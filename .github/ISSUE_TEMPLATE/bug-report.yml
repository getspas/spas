name: Bug report
description: Report reproducible behavior that does not match the documented contract.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Do not include asset contents, credentials, repository tokens, non-public repository URLs, or unsanitized `spas diff` output.
  - type: input
    id: spas-version
    attributes:
      label: SPAS version
      description: Paste the complete output of `spas version`.
      placeholder: spas 1.0.0 (commit abc1234, built 2026-08-14T00:00:00Z)
    validations:
      required: true
  - type: input
    id: git-version
    attributes:
      label: Git version
      description: Paste the output of `git --version`.
      placeholder: git version 2.50.1
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - amd64
        - arm64
        - Other or unknown
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - GitHub release archive
        - go install
        - Local source build
        - Other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Show the exact command after replacing repository names, local paths, and asset values with placeholders.
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest safe sequence that reproduces the problem. Use placeholder repositories and file content.
      placeholder: |
        1. Initialize a project repository...
        2. Run `spas link example/project-assets ...`
        3. Run `spas ...`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What documented result did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the exit code and sanitized error text.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Add relevant `spas status`, `spas doctor`, or JSON output after removing repository and asset data. Never paste default `spas diff` output.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and discussions for this problem.
          required: true
        - label: I removed credentials, asset contents, non-public repository URLs, and identifying local paths.
          required: true

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    uses: ./.github/workflows/ci.yml

  codeql:
    name: Analyze release source
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  release:
    name: Build and attest draft release
    needs: [verify, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Update package metadata
        run: sudo apt-get update
      - name: Install GnuPG
        run: sudo apt-get install --no-install-recommends -y gnupg
      - name: Prepare RPM signing key
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
          RPM_SIGNING_FINGERPRINT: ${{ vars.RPM_SIGNING_FINGERPRINT }}
          SPAS_PACKAGE_MAINTAINER: ${{ vars.SPAS_PACKAGE_MAINTAINER }}
        run: bash scripts/distribution/prepare-rpm-signing.sh
      - name: Build draft and package-manager recipes
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPAS_PACKAGE_MAINTAINER: ${{ vars.SPAS_PACKAGE_MAINTAINER }}
          NFPM_LINUX_PACKAGES_RPM_PASSPHRASE: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
      - name: Generate Homebrew formula
        run: python3 scripts/distribution/generate-homebrew-formula.py
      - name: Include public signing key for attestation
        run: cp .distribution/spas-rpm-signing.asc dist/spas-rpm-signing.asc
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Attest generated package-manager recipes
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/homebrew/Formula/spas.rb
            dist/scoop/bucket/spas.json
            dist/winget/manifests/g/GetSPAS/SPAS/*/GetSPAS.SPAS*.yaml
      # Keep package-manager recipes in workflow artifacts, outside the release downloads.
      # The dist root and artifact name must match publish-recipes.sh's download paths.
      - name: Store package-manager recipes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-manager-recipes
          path: |
            dist/homebrew/Formula/spas.rb
            dist/scoop/bucket/spas.json
            dist/winget/manifests/g/GetSPAS/SPAS/*/GetSPAS.SPAS*.yaml
          if-no-files-found: error
          overwrite: true
      - name: Remove temporary private key
        if: always()
        run: rm -f .distribution/rpm-signing.key
